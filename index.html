<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amanueal Tefera’s Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#14162B; --muted:#666A82; --line:#E6E8F0;
  --c-political:#1535A8; --c-economic:#B3141F; --c-social:#0B6B35;
  --head:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.1rem;line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.political{--c:var(--c-political)} .economic{--c:var(--c-economic)} .social{--c:var(--c-social)}
.bar{display:flex;height:8px}
.bar i{flex:1;transition:background-color 1.2s ease}
.bar i:nth-child(1){background:var(--c-political)}.bar i:nth-child(2){background:var(--c-economic)}.bar i:nth-child(3){background:var(--c-social)}
.wrap{max-width:920px;margin:0 auto;padding:0 22px}
header{padding:26px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--head);font-weight:800;font-size:1.3rem;text-decoration:none;letter-spacing:-.01em}
.tag{color:var(--muted);font-style:italic;font-size:.95rem}

.hero{padding:44px 0 6px}
h1{font-family:var(--head);font-weight:800;font-size:clamp(2.4rem,8vw,4.6rem);line-height:.98;letter-spacing:-.03em;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 28px;max-width:46ch}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{position:relative;overflow:hidden;text-align:left;background:#fff;border:2px solid var(--line);border-bottom:6px solid var(--c);border-radius:18px;
  padding:20px 18px 18px;min-height:132px;cursor:pointer;font:inherit;color:var(--ink);
  transition:background-color 1.2s ease,border-color 1.2s ease,color .3s}
.tile::after{content:"";position:absolute;right:-34px;top:-34px;width:96px;height:96px;border-radius:50%;background:var(--c);transition:background-color 1.2s ease}
.tile b{position:relative;display:block;font-family:var(--head);font-weight:800;font-size:clamp(1.15rem,3.6vw,1.7rem);letter-spacing:-.02em;line-height:1.1;margin-top:34px}
.tile small{position:relative;color:var(--muted)}
.tile[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tile[aria-pressed="true"] small{color:#fff;opacity:.9}
.tile[aria-pressed="true"]::after{background:rgba(255,255,255,.28)}
.status{margin:20px 0 0;color:var(--muted);font-size:1rem;min-height:1.6em}
.status button{font:inherit;background:none;border:0;border-bottom:1px solid currentColor;color:var(--ink);cursor:pointer;padding:0}

.list{margin:16px 0 80px;border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:118px 1fr;gap:6px 24px;padding:26px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:start;position:relative}
.row::before{content:"";position:absolute;left:-14px;top:26px;bottom:26px;width:4px;border-radius:4px;background:var(--c);transition:background-color 1.2s ease}
.row:hover h2{text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:3px;text-underline-offset:5px}
.date{color:var(--muted);font-size:.95rem;padding-top:.45rem}
.row h2{font-family:var(--head);font-weight:800;font-size:clamp(1.3rem,3.4vw,1.8rem);line-height:1.15;letter-spacing:-.02em;margin:6px 0}
.row p{margin:0;color:var(--muted);max-width:58ch}
.chip{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:1px 12px;font-family:var(--head);font-weight:500;font-size:.85rem;transition:background-color 1.2s ease}
.empty{padding:46px 0;color:var(--muted)}
.empty b{font-family:var(--head);color:var(--ink);font-size:1.3rem;display:block;margin-bottom:4px}

.back{display:inline-block;margin:34px 0 10px;font-family:var(--head);font-weight:500;text-decoration:none;border-bottom:2px solid var(--c)}
article{max-width:62ch;margin:0 auto 90px}
article h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:16px 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--muted);font-size:.95rem}
article p{font-size:1.2rem;line-height:1.75;margin:0 0 1.2em}
article p:first-of-type{margin-top:1.8em}
footer{padding:0 0 30px;color:var(--muted);font-size:.95rem}
@media (max-width:620px){
  .tiles{gap:8px}.tile{padding:14px 12px;min-height:118px;border-radius:14px}
  .tile::after{width:70px;height:70px;right:-26px;top:-26px}.tile b{margin-top:26px}
  .row{grid-template-columns:1fr}.row::before{left:-12px}
}
@media (prefers-reduced-motion:reduce){.tile,.bar i,.chip,.row::before,.tile::after{transition:none}}
</style>
</head>
<body>
<div class="bar" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <a class="brand" href="#" id="home"></a>
    <span class="tag">New posts every week</span>
  </header>
  <main id="app"></main>
</div>
<div class="wrap"><footer id="foot"></footer></div>
<div class="bar" aria-hidden="true"><i></i><i></i><i></i></div>

<script>
/* ============ EDIT THESE ============ */
const SITE_NAME = "Amanueal Tefera’s Blog";

/* Add each new weekly post at the top of this list. Copy this format:
  { id:"my-first-post",          // letters, numbers, hyphens only
    date:"2026-11-16",           // year-month-day
    topic:"political",           // "political", "economic" or "social"
    title:"Your title",
    excerpt:"One sentence shown on the homepage.",
    body:["First paragraph.","Second paragraph."] },
*/
const POSTS = [{ id:"disagreement-without-contempt",
  date:"2026-11-12",
  topic:"political",
  title:"Disagreement Isn’t the Problem. Refusing to Listen Is.",
  excerpt:"We can hold firm beliefs, question our own side, and still take each other seriously.",
  body:[
    "Political disagreement is something we should expect in a country where people have different backgrounds, beliefs, and priorities. I do not think the goal should be to make everyone agree. My concern is what happens when disagreement becomes a reason to stop listening. When a person’s political affiliation matters more than the reasoning behind their opinion, it becomes difficult to have a productive conversation.",
    "To me, political polarization becomes a serious problem when supporting a party means defending everything it does. A voter should be able to support a candidate while questioning that candidate’s decisions. Being willing to criticize someone you voted for shows that your support comes with expectations. If we expect accountability only from the opposing party, we give our own leaders too much room to disappoint us.",
    "I think this is where individual responsibility matters. Before defending a position, we should ask whether we actually agree with it or whether we feel obligated to support it. Would we accept the same decision if the other party made it? That question can be uncomfortable, but it is a fair way to examine our own judgment. Our standards should remain consistent even when applying them becomes politically inconvenient.",
    "The way we discuss politics matters just as much. Consider a conversation about government spending. One person may be concerned about families who need immediate assistance, while another may be concerned about whether a program can be funded over time. Those concerns can exist together. A useful discussion would examine how to address both. Calling one person heartless or the other irresponsible ends that discussion before either side has explained its position.",
    "That does not mean every argument deserves equal weight. Some claims are inaccurate, and some proposals have serious weaknesses. Respectful disagreement still requires questioning evidence and identifying consequences. However, there is a difference between challenging an argument and deciding that the person making it has nothing worthwhile to say.",
    "I also believe we need to be more careful about how we respond to political content online. Before sharing a clip or reacting to a headline, we should take enough time to understand what was said and what information might be missing. I would rather arrive at an informed opinion later than immediately defend something I have not examined. There should be no embarrassment in saying, “I need to look into that.”",
    "Reducing polarization will require more than asking politicians to behave differently. It also requires voters to reward honesty, accept reasonable criticism, and leave room for people to reconsider their views. Changing an opinion after learning something new should be treated as responsible judgment.",
    "I want political conversations to produce something useful: a clearer understanding of a problem, a stronger proposal, or even a better explanation of why we disagree. We can hold firm beliefs and still take each other seriously. If we expect our leaders to put the country ahead of their party, we should be willing to apply that same standard to ourselves."
  ] },
];
/* ================================== */

const TOPICS = ["political","economic","social"];   // display order
const NAMES = {political:"Political",economic:"Economic",social:"Social"};
let current = null;
const app = document.getElementById("app");
const fmt = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});

document.title = SITE_NAME;
document.getElementById("home").textContent = SITE_NAME;
document.getElementById("foot").textContent = "© 2026 " + SITE_NAME;


function home(){
  const n = t => POSTS.filter(p=>p.topic===t).length;
  app.innerHTML = `
  <section class="hero">
    
    <p class="sub">A new post every week on each of three topics. Pick one below, or read everything.</p>
    <div class="tiles">
      ${TOPICS.map(t=>`<button class="tile ${t}" data-t="${t}" aria-pressed="false"><b>${NAMES[t]}</b><small>${n(t)} ${n(t)===1?"post":"posts"}</small></button>`).join("")}
    </div>
    <p class="status" id="status" aria-live="polite"></p>
  </section>
  <section class="list" id="list"></section>`;
  document.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>{
    current = current===b.dataset.t ? null : b.dataset.t; paint();
  }));
  paint();
}

function paint(){
  document.querySelectorAll(".tile").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===current));
  const shown = POSTS.filter(p=>!current||p.topic===current).sort((a,b)=>b.date.localeCompare(a.date));
  const st = document.getElementById("status");
  st.innerHTML = current
    ? `Showing ${NAMES[current].toLowerCase()} posts. <button id="clr">Show all</button>`
    : (POSTS.length ? `Showing all ${POSTS.length} ${POSTS.length===1?"post":"posts"}, newest first.` : "");
  const clr = document.getElementById("clr"); if(clr) clr.onclick=()=>{current=null;paint()};
  document.getElementById("list").innerHTML = shown.length ? shown.map(p=>`
    <a class="row ${p.topic}" href="#${p.id}">
      <span class="date">${fmt(p.date)}</span>
      <div><span class="chip">${NAMES[p.topic]}</span><h2>${p.title}</h2><p>${p.excerpt}</p></div>
    </a>`).join("") : `<div class="empty"><b>${current?"No "+NAMES[current].toLowerCase()+" posts yet.":"The first posts are on the way."}</b>Check back soon, new posts arrive every week.</div>`;
}

function read(p){
  window.scrollTo(0,0);
  app.innerHTML = `
  <a class="back ${p.topic}" href="#">Back to all posts</a>
  <article class="${p.topic}">
    <div class="meta"><span class="chip">${NAMES[p.topic]}</span><span>${fmt(p.date)}</span></div>
    <h1>${p.title}</h1>
    ${p.body.map(t=>`<p>${t}</p>`).join("")}
  </article>`;
  document.title = p.title + " | " + SITE_NAME;
}

function route(){
  const p = POSTS.find(x=>x.id===location.hash.slice(1));
  document.title = SITE_NAME;
  p ? read(p) : home();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
